<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RewardHub Diagnostic</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
body{
    font-family:Arial,sans-serif;
    background:#121212;
    color:#fff;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    height:100vh;
}

button{
    padding:18px 30px;
    font-size:18px;
    border:none;
    border-radius:10px;
    background:#FFD54A;
    color:#000;
    cursor:pointer;
}

pre{
    width:90%;
    margin-top:20px;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>

</head>
<body>

<h2>RewardHub Diagnostic</h2>

<button id="testBtn">
Test Backend
</button>

<pre id="result">
Waiting...
</pre>

<script>

const API =
"https://http--rewardhub-production-bot--7yrkypbyrrz6.code.run/api/v1/health";

const btn=document.getElementById("testBtn");

const result=document.getElementById("result");

btn.addEventListener("click",async()=>{

    result.textContent="Button clicked...\n";

    try{

        const response=await fetch(API);

        const text=await response.text();

        result.textContent+=
        "\nHTTP "+response.status+
        "\n\n"+
        text;

    }catch(e){

        result.textContent+=
        "\nERROR\n\n"+
        e;

    }

});

</script>

</body>
</html>
